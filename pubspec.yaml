name: appwidgetflutter
description: A new Flutter application.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=2.18.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  flutter_screenutil: any
  firebase_core: ^1.13.1
  firebase_storage: ^10.2.9
  firebase_database: ^9.0.11
  provider: ^6.0.2
  cloud_firestore: ^2.1.0
  hive: ^2.0.4
  path_provider: ^2.0.1
  animated_toggle_switch: ^0.5.2
  home_widget: ^0.1.6
  expand_widget: ^3.1.0
  expandable: ^5.0.1
  shared_preferences: ^2.0.15
  google_fonts: ^3.0.1
  cached_network_image: ^3.2.3
  json_annotation: ^4.6.0
  responsive_builder: ^0.4.3
  flutter_dropzone: ^3.0.5
  dotted_border: ^2.0.0+3
  universal_html: ^2.0.8
  image_network: ^2.5.1
  reorderable_grid_view: ^2.2.5
  flutter_share: ^2.0.0
  firebase_auth: ^3.11.2
  rating_dialog: ^2.0.4
  in_app_review: ^2.0.6
  flutter_background_service: ^2.4.6
  android_alarm_manager_plus: ^2.1.0
  google_mobile_ads: ^2.3.0
  native_ads_flutter: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  freezed: ^2.3.2
  json_serializable: ^6.1.5
  hive_generator: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true



  assets:
    - assets/
    - assets/icons/

  fonts:
    - family: franklin_gothic
      fonts:
        - asset: assets/fonts/franklin_gothic/fgwo____.ttf
          weight: 700
    - family: franklin_gothic_frankgo
      fonts:
        - asset: assets/fonts/franklin_gothic/FRANKGO.ttf
          weight: 900
        - asset: assets/fonts/franklin_gothic/Franklin Gothic Condensed.ttf
        - asset: assets/fonts/franklin_gothic/FranklinGothic.ttf
        - asset: assets/fonts/franklin_gothic/FranklinGothicITALIC.ttf